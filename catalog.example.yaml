# Copy to ~/.config/tscatalog/catalog.yaml (or ./catalog.yaml) and edit.
#
# Public URL is always https://<tailscale-label>.<tailnet>.ts.net on 443.
# Catalog name may contain dots; Tailscale VIP label defaults to hyphens (abc.xyz → abc-xyz) or set vip:.
# The app's localhost port never appears in DNS — the Service
# endpoint is tcp:443; local is only the Serve backend.
#
#   tscatalog up              launch + apply + health
#   tscatalog health
#   tscatalog apply --dry-run

endpoint: tcp:443

access:
  src: [autogroup:member]
  # Tag on the host *and* on each VIP Service. autoApprovers uses this
  # tag as the service selector (svc:* is not valid).
  # The machine running tscatalog must carry this tag (apply requests it
  # via tailscale up --advertise-tags). User-authenticated devices cannot
  # host VIP Services.
  autoApproveHost: tag:server
  # Who may apply that tag to a device. Include identities that run apply
  # (e.g. autogroup:member for self-hosted laptops, autogroup:admin for ops).
  # apply merges this into the live ACL (fills empty tagOwners; keeps others).
  tagOwners: [autogroup:admin]

services:
  - name: web
    displayName: Example web UI
    local: http://127.0.0.1:8080
    comment: HTTPS on 443, proxied to a local HTTP server
    launch:
      start: [my-web, start]
      stop: [my-web, stop]
    check:
      path: /health
      expect: [200]
      public: [200]

  - name: api
    displayName: Example API
    local: http://127.0.0.1:8081
    comment: Detach a long-running process (Unix); logs/pidfiles in XDG state dir
    autostart: true
    launch:
      cwd: ~/src/api
      start: [api, serve, --bind, 127.0.0.1:8081]
      detach: true
    check:
      public: [200, 401]

  # Not a Tailscale Service. up api starts it first; stop api leaves it running.
  - name: worker
    local: http://127.0.0.1:8082
    unpublished: true
    requires: [api]
    launch:
      start: [worker, start]
      stop: [worker, stop]
      status: [worker, status]
      logs: [worker, logs]

  # files are relative to cwd, not the directory tscatalog was started from.
  - name: edge
    displayName: Example Compose proxy
    local: http://127.0.0.1:8083
    launch:
      kind: compose
      name: edge
      cwd: ~/src/edge
      files: [compose.yaml]
      services: [proxy]
