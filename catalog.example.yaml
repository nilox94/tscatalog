# Copy to ~/.config/tscatalog/catalog.yaml or ./catalog.yaml and edit.
# The commands and directories below are placeholders. Replace them before up.
#
# Public URL: https://<label>.<tailnet>.ts.net on port 443.
# A dotted name becomes a hyphenated label (abc.xyz to abc-xyz) unless vip is set.
# local stays on loopback. It is the Serve backend, not the public port.
#
#   tscatalog plan            writes nothing
#   tscatalog up              start, then apply, then health
#   tscatalog up --local      start and health only

endpoint: tcp:443

access:
  src: [autogroup:member]
  # Tag on the host *and* on each VIP Service. autoApprovers uses this
  # tag as the service selector (svc:* is not valid).
  # The machine running tscatalog must carry this tag (apply requests it
  # via tailscale up --advertise-tags). User-authenticated devices cannot
  # host VIP Services.
  autoApproveHost: tag:server
  # Who may apply that tag to a device. Include identities that run apply
  # (e.g. autogroup:member for self-hosted laptops, autogroup:admin for ops).
  # apply merges this into the live ACL. It fills empty tagOwners and keeps others.
  tagOwners: [autogroup:admin]

services:
  - name: web
    displayName: Example web UI
    local: http://127.0.0.1:8080
    comment: HTTPS on 443, proxied to a local HTTP server
    launch:
      start: [my-web, start]
      stop: [my-web, stop]
    check:
      path: /health
      expect: [200]
      public: [200]

  - name: api
    displayName: Example API
    local: http://127.0.0.1:8081
    comment: Detach a long-running process on Unix. Logs and pid files are in the XDG state dir
    autostart: true
    launch:
      cwd: ~/src/api
      start: [api, serve, --bind, 127.0.0.1:8081]
      detach: true
    check:
      public: [200, 401]

  # Unpublished. Not a Tailscale Service.
  # up worker starts api, then worker. up api does not start worker.
  # stop worker leaves api running. stop does not follow requires.
  - name: worker
    local: http://127.0.0.1:8082
    unpublished: true
    requires: [api]
    launch:
      start: [worker, start]
      stop: [worker, stop]
      status: [worker, status]
      logs: [worker, logs]

  # files are relative to cwd, not the directory tscatalog was started from.
  - name: edge
    displayName: Example Compose proxy
    local: http://127.0.0.1:8083
    launch:
      kind: compose
      name: edge
      cwd: ~/src/edge
      files: [compose.yaml]
      services: [proxy]
